<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#29215f"><title>Quizloom · Quick Quiz</title><style>
:root{--bg:#f6f5ff;--ink:#201b3e;--muted:#77728e;--line:#e6e3f4;--purple:#5c4ac7;--soft:#eeebff;--surface:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink)}.wrap{max-width:920px;margin:auto;padding:28px clamp(16px,4vw,40px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;background:var(--purple);border-radius:13px;display:grid;place-items:center;color:#fff;font-size:22px}h1{font-size:22px;margin:0}.muted{color:var(--muted)}.hero{background:linear-gradient(120deg,#29215f,#6958d8);color:white;border-radius:23px;padding:clamp(25px,5vw,46px);position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;font-size:270px;right:25px;top:-98px;font-weight:900;opacity:.08}.hero h2{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.05em;margin:9px 0}.hero p{max-width:520px;color:#e3deff}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#f7e8a9;color:#34284b}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.topic{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;text-align:left;cursor:pointer}.topic.active{border:2px solid var(--purple);background:#f2efff;padding:16px}.topic .icon{font-size:23px}.topic strong{display:block;margin-top:8px}.topic span{font-size:12px;color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);box-shadow:0 15px 45px #33286a0a}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-weight:800;font-size:12px;color:var(--purple);background:var(--soft);padding:6px 10px;border-radius:100px}.progress{height:7px;background:#eeeaf9;border-radius:99px;overflow:hidden;margin:16px 0 25px}.progress div{height:100%;background:var(--purple);width:0;transition:width .2s}.question{font-size:clamp(21px,3vw,28px);line-height:1.2;margin:0 0 20px;letter-spacing:-.03em}.answers{display:grid;gap:10px}.answer{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border:1px solid var(--line);background:white;border-radius:12px;color:var(--ink);cursor:pointer;font:inherit}.answer .letter{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#f4f2fb;color:var(--purple);font-weight:800;flex-shrink:0}.answer.selected{border:2px solid var(--purple);background:#f6f4ff;padding:13px}.answer.correct{border-color:#2b8a57;background:#edf8f1}.answer.wrong{border-color:#c64b53;background:#fff0f0}.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.feedback{font-size:13px;margin-top:12px;min-height:20px;color:var(--muted)}.result{text-align:center;padding:20px}.result .score{font-size:58px;font-weight:900;color:var(--purple);letter-spacing:-.06em}.result h3{font-size:28px;margin:0}.empty{text-align:center;padding:25px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}@media(max-width:580px){.topics{grid-template-columns:1fr}.topic{display:flex;align-items:center;gap:12px}.topic .icon{font-size:26px}.topic strong{margin:0}.topic span{margin-left:auto}.quiz-head{align-items:flex-start}.hero{border-radius:18px}.quiz-actions .btn{padding:10px 12px}}
</style></head><body><div class="wrap"><header><div class="brand"><div class="logo">?</div><div><h1>Quizloom</h1><div class="muted" style="font-size:13px">Quick quizzes, brighter minds</div></div></div><span class="muted" style="font-size:12px">Practice mode</span></header><section class="hero"><div style="font-size:11px;font-weight:800;letter-spacing:.15em;color:#ddd6ff">LEARN BY PLAYING</div><h2>Curiosity is your superpower.</h2><p>Choose a topic, test what you know, and get instant feedback as you go. No sign-in required.</p><button class="btn primary" id="start">Start a quiz →</button></section><section class="topics" id="topics"><button class="topic active" data-topic="web"><span class="icon">🌐</span><span><strong>Web basics</strong><span>HTML, CSS & browser</span></span></button><button class="topic" data-topic="java"><span class="icon">☕</span><span><strong>Java basics</strong><span>Language fundamentals</span></span></button><button class="topic" data-topic="logic"><span class="icon">🧩</span><span><strong>Logic & CS</strong><span>Concepts and reasoning</span></span></button></section><section class="panel" id="stage" aria-live="polite"></section><footer>Quizloom · Practice questions for learning only · Your score stays in this browser session</footer></div><script>
(()=>{const bank={web:[{q:'Which HTML element is commonly used for the largest page heading?',a:['<heading>','<h1>','<head>','<title>'],c:1,e:'The h1 element represents the top-level heading in the page content.'},{q:'Which CSS property changes the text color?',a:['font-style','background','color','text-decoration'],c:2,e:'The color property sets the foreground color of text.'},{q:'Which JavaScript keyword declares a block-scoped variable that can be reassigned?',a:['let','const','static','final'],c:0,e:'let creates a block-scoped binding that can be reassigned.'},{q:'What does CSS Flexbox primarily help with?',a:['Database queries','Layout alignment','Encrypting data','Compiling Java'],c:1,e:'Flexbox helps align and distribute items in a one-dimensional layout.'},{q:'Which attribute provides alternative text for an image?',a:['src','href','alt','role'],c:2,e:'The alt attribute provides text alternatives for images.'}],java:[{q:'Which keyword defines a class in Java?',a:['function','class','struct','object'],c:1,e:'The class keyword declares a Java class.'},{q:'Which type stores true or false?',a:['int','String','boolean','char'],c:2,e:'boolean has the two values true and false.'},{q:'Which method is the conventional Java application entry point?',a:['start()','run()','main()','init()'],c:2,e:'The Java launcher looks for public static void main(String[] args), subject to supported launch modes.'},{q:'Which collection does not allow duplicate elements?',a:['Set','List','ArrayList','Queue'],c:0,e:'The Set interface models a collection with no duplicate elements.'},{q:'What does JVM stand for?',a:['Java Variable Mode','Java Virtual Machine','Joined Version Manager','Java Verified Method'],c:1,e:'The Java Virtual Machine runs Java bytecode.'}],logic:[{q:'What is the next number: 2, 4, 8, 16, …?',a:['18','24','30','32'],c:3,e:'Each term doubles, so 16 × 2 = 32.'},{q:'Which structure follows FIFO order?',a:['Stack','Queue','Tree','Graph'],c:1,e:'A queue processes the first item added before later items.'},{q:'What is the time complexity of binary search on sorted data?',a:['O(n)','O(log n)','O(n²)','O(1) always'],c:1,e:'Binary search halves the remaining search interval each step.'},{q:'Which of these is a relational database?',a:['PostgreSQL','HTML','CSS','Git'],c:0,e:'PostgreSQL is a relational database management system.'},{q:'Which HTTP method is generally used to retrieve a resource?',a:['POST','PATCH','GET','DELETE'],c:2,e:'GET requests a representation of a resource.'}]};let topic='web',index=0,answers=[],finished=false;const $=id=>document.getElementById(id);function render(){const list=bank[topic],score=answers.reduce((s,a,i)=>s+(a===list[i].c?1:0),0);if(finished){$('stage').innerHTML='<div class="result"><div style="font-size:45px">🎉</div><h3>Quiz complete!</h3><p class="muted">You finished '+list.length+' questions.</p><div class="score">'+score+'/'+list.length+'</div><p>'+(score===list.length?'Perfect score! Excellent work.':score>=3?'Good work — review the explanations and keep practising.':'Every attempt helps. Review the explanations and try again.')+'</p><button class="btn primary" id="again">Try again</button> <button class="btn outline" id="switch">Choose another topic</button></div>';return}const q=list[index],picked=answers[index];$('stage').innerHTML='<div class="quiz-head"><span class="pill">'+({web:'Web basics',java:'Java basics',logic:'Logic & CS'}[topic])+'</span><span class="muted" style="font-size:13px">Question '+(index+1)+' of '+list.length+'</span></div><div class="progress"><div style="width:'+((index+(picked!==undefined?1:0))/list.length*100)+'%"></div></div><h3 class="question">'+q.q.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</h3><div class="answers">'+q.a.map((a,i)=>'<button class="answer '+(picked!==undefined?(i===q.c?'correct':i===picked?'wrong':''):(picked===i?'selected':''))+'" data-answer="'+i+'" '+(picked!==undefined?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+a.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span></button>').join('')+'</div><div class="feedback" role="status">'+(picked!==undefined?(picked===q.c?'✓ Correct. ':'Not quite. ')+q.e:'Choose the best answer to reveal an explanation.')+'</div><div class="quiz-actions"><button class="btn outline" id="reset">Restart</button><button class="btn primary" id="next" '+(picked===undefined?'disabled':'')+'>'+(index===list.length-1?'See results':'Next question →')+'</button></div>'}function start(){index=0;answers=[];finished=false;render()}$('topics').addEventListener('click',e=>{const b=e.target.closest('[data-topic]');if(!b)return;topic=b.dataset.topic;document.querySelectorAll('.topic').forEach(x=>x.classList.toggle('active',x===b));start()});$('start').addEventListener('click',()=>{$('stage').scrollIntoView({behavior:'smooth',block:'start'})});$('stage').addEventListener('click',e=>{const a=e.target.closest('[data-answer]');if(a&&answers[index]===undefined){answers[index]=Number(a.dataset.answer);render();return}if(e.target.id==='next'&&answers[index]!==undefined){if(index===bank[topic].length-1)finished=true;else index++;render()}if(e.target.id==='reset')start();if(e.target.id==='again')start();if(e.target.id==='switch')$('topics').scrollIntoView({behavior:'smooth'})});render();Object.keys(bank).forEach(topicName=>fetch('/api/quiz/questions?topic='+encodeURIComponent(topicName)).then(r=>{if(!r.ok)throw new Error('API '+r.status);return r.json()}).then(items=>{if(Array.isArray(items)&&items.length){bank[topicName]=items.map(q=>({q:q.question,a:q.choices,c:q.answer,e:q.explanation}));if(topic===topicName)render()}}).catch(()=>{}));})();
</script></body></html>
